<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MONIR // LIFE OS</title>
<style>
:root{--bg:#05080f;--panel:#0a0f1a;--border:#1a2535;--gold:#d4a017;--cyan:#00d4ff;--green:#00ff7f;--red:#ff4455;--text:#c8d8e8;--dim:#3a4a5a;--f:'Courier New',monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--f);font-size:13px}
body::after{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.04) 2px,rgba(0,0,0,.04) 4px);pointer-events:none;z-index:9999}
button{background:transparent;border:1px solid var(--border);color:var(--text);cursor:pointer;font-family:var(--f);font-size:12px;padding:6px 12px;transition:all .15s}
button:hover{border-color:var(--gold);color:var(--gold)}
input,select,textarea{background:rgba(255,255,255,.04);border:1px solid var(--border);color:var(--text);font-family:var(--f);font-size:12px;padding:7px 10px;outline:none;width:100%}
input:focus,select:focus{border-color:var(--cyan)}
input[type=range]{padding:0;cursor:pointer;accent-color:var(--cyan)}
input[type=checkbox]{accent-color:var(--gold);cursor:pointer;width:auto;min-width:auto}
select option{background:var(--panel)}
.hidden{display:none!important}

/* BOOT */
#boot{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px;z-index:100}
#boot-text{color:var(--green);font-size:13px;line-height:1.9;white-space:pre;min-height:120px}
#boot-bar{width:280px;height:2px;background:var(--dim)}
#boot-fill{height:100%;background:var(--green);width:0;transition:width .08s}

/* ONBOARDING */
#ob-overlay{position:fixed;inset:0;background:rgba(5,8,15,.96);z-index:50;display:flex;align-items:center;justify-content:center;overflow-y:auto;padding:20px}
#ob-box{width:min(580px,96vw);border:1px solid var(--gold);background:var(--panel);padding:28px 32px}
#ob-title{color:var(--gold);font-size:16px;letter-spacing:4px;margin-bottom:2px}
#ob-sub{color:var(--dim);font-size:10px;letter-spacing:2px;margin-bottom:18px}
#ob-pips{display:flex;gap:4px;margin-bottom:18px}
.pip{height:3px;flex:1;background:var(--dim);transition:background .3s}
.pip.done{background:var(--gold)}
.pip.active{background:var(--cyan)}
#ob-body{min-height:200px}
.obl{color:var(--dim);font-size:10px;letter-spacing:2px;margin-bottom:5px;display:block;margin-top:12px}
.ob-row{display:flex;gap:10px}
.ob-row>div{flex:1}
.sr{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.sr label{width:110px;font-size:10px;color:var(--dim);letter-spacing:1px;flex-shrink:0}
.sr input[type=range]{flex:1}
.sr span{width:28px;text-align:right;color:var(--cyan);font-size:12px}
.ob-list{list-style:none}
.ob-list li{display:flex;gap:6px;margin-bottom:6px;align-items:center}
.ob-list li input[type=text]{flex:1}
.ob-list li .lnum{width:55px;flex-shrink:0}
.ob-list li .lemu{width:40px;flex-shrink:0}
.ob-list li .lxp{width:55px;flex-shrink:0}
.ob-list li button.rm{padding:2px 7px;color:var(--red);border-color:var(--red);font-size:11px;flex-shrink:0}
.ob-add{color:var(--green);border-color:var(--green);font-size:11px;padding:4px 10px;margin-top:4px}
#ob-footer{display:flex;justify-content:space-between;align-items:center;margin-top:20px}
#ob-info{color:var(--dim);font-size:10px}
#ob-next{background:var(--gold);color:var(--bg);border:none;padding:10px 28px;font-size:12px;letter-spacing:3px;font-family:var(--f);cursor:pointer}
#ob-next:hover{background:#e8b820}
#ob-prev{color:var(--dim);border-color:var(--dim);padding:8px 14px}
#ob-prev:hover{color:var(--text);border-color:var(--text)}

/* APP */
#app{display:flex;flex-direction:column;height:100vh}
#hdr{display:flex;align-items:center;gap:12px;padding:7px 14px;background:var(--panel);border-bottom:1px solid var(--border);flex-shrink:0;min-height:46px}
#hdr-name{color:var(--gold);font-size:14px;letter-spacing:3px;white-space:nowrap}
.sep{color:var(--dim)}
#hdr-lvl{background:var(--gold);color:var(--bg);font-size:10px;padding:2px 8px;letter-spacing:2px;white-space:nowrap;font-weight:bold}
#xp-wrap{flex:1;min-width:80px}
#xp-bg{height:5px;background:var(--dim)}
#xp-fill{height:100%;background:linear-gradient(90deg,var(--green),var(--cyan));width:0;transition:width .6s}
#xp-txt{color:var(--dim);font-size:9px;margin-top:2px;letter-spacing:1px}
#hdr-city{color:var(--dim);font-size:10px;white-space:nowrap}
#hdr-time{color:var(--cyan);font-size:11px;white-space:nowrap;min-width:48px;text-align:right}
#main{display:flex;flex:1;overflow:hidden}

/* LEFT */
#left{width:210px;flex-shrink:0;border-right:1px solid var(--border);overflow-y:auto;padding:10px}
.ptitle{color:var(--gold);font-size:9px;letter-spacing:3px;margin-bottom:8px;padding-bottom:3px;border-bottom:1px solid var(--border)}
.statrow{display:flex;align-items:center;gap:6px;margin-bottom:7px}
.slabel{width:78px;font-size:9px;color:var(--dim);letter-spacing:1px;flex-shrink:0}
.sbg{flex:1;height:3px;background:var(--dim)}
.sfill{height:100%;transition:width .5s}
.sval{width:26px;text-align:right;font-size:9px}
.reprow{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.rlabel{width:82px;font-size:9px;color:var(--dim);letter-spacing:1px}
.stars{color:var(--gold);font-size:10px;letter-spacing:2px}

/* CENTER */
#center{flex:1;display:flex;flex-direction:column;align-items:center;overflow:hidden;padding:10px 6px;min-width:180px}
#fig-wrap{flex:1;display:flex;align-items:center;justify-content:center;position:relative;width:100%;max-height:200px}
#fig-label{position:absolute;bottom:0;left:50%;transform:translateX(-50%);color:var(--dim);font-size:9px;letter-spacing:2px}
#stick-fig{filter:drop-shadow(0 0 6px var(--green))}
#pri-box{width:100%;border:1px solid var(--border);padding:10px;background:var(--panel);margin-top:6px;flex-shrink:0}
#pri-out{min-height:70px;max-height:130px;overflow-y:auto;color:var(--text);font-size:11px;line-height:1.65;white-space:pre-wrap}
#pri-foot{display:flex;gap:6px;justify-content:flex-end;margin-top:8px}
#btn-pri{border-color:var(--cyan);color:var(--cyan);font-size:10px;padding:5px 14px;letter-spacing:1px}
#btn-pri:hover{background:var(--cyan);color:var(--bg)}

/* RIGHT */
#right{width:275px;flex-shrink:0;border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
#tabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0}
.tbtn{flex:1;padding:9px 2px;font-size:9px;letter-spacing:2px;border:none;border-bottom:2px solid transparent;color:var(--dim)}
.tbtn.active{color:var(--gold);border-bottom-color:var(--gold)}
.tbtn:hover{color:var(--text)}
#tab-c{flex:1;overflow-y:auto;padding:10px}
.mqtitle{color:var(--gold);font-size:12px;margin-bottom:4px}
.mqbar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.mqpct{font-size:10px;color:var(--cyan)}
.mile{display:flex;align-items:center;gap:6px;margin-bottom:5px;cursor:pointer;padding:3px 0}
.mile label{font-size:11px;cursor:pointer;flex:1}
.mile.done label{color:var(--dim);text-decoration:line-through}
.sec-t{color:var(--dim);font-size:9px;letter-spacing:2px;margin:10px 0 6px;padding-top:8px;border-top:1px solid var(--border)}
.hrow{display:flex;align-items:center;gap:7px;padding:5px 6px;border:1px solid var(--border);margin-bottom:4px;cursor:pointer}
.hrow:hover{border-color:var(--green)}
.hcheck{width:14px;height:14px;border:1px solid var(--green);display:flex;align-items:center;justify-content:center;font-size:10px;flex-shrink:0;color:var(--bg)}
.hrow.done .hcheck{background:var(--green)}
.hrow.done{opacity:.5}
.hname{flex:1;font-size:11px}
.hxp{color:var(--gold);font-size:9px}
.bcard{border:1px solid var(--border);padding:7px;margin-bottom:5px}
.bname{color:var(--cyan);font-size:11px;margin-bottom:2px}
.bmeta{font-size:9px;color:var(--dim)}
.bact{color:var(--gold);font-size:9px;margin-top:3px;font-style:italic}
.agrid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.acard{border:1px solid var(--border);padding:7px;text-align:center}
.acard.owned{border-color:var(--green)}.acard.locked{opacity:.35}.acard.in-dev{border-color:var(--gold)}
.aemoji{font-size:18px}.aname{font-size:9px;margin-top:3px;color:var(--dim)}.astatus{font-size:8px;margin-top:1px;letter-spacing:1px}
.acard.owned .astatus{color:var(--green)}.acard.locked .astatus{color:var(--dim)}.acard.in-dev .astatus{color:var(--gold)}

/* CHAT */
#chat-s{border-top:1px solid var(--border);flex-shrink:0;display:flex;flex-direction:column;height:195px}
#msgs{flex:1;overflow-y:auto;padding:6px 12px;display:flex;flex-direction:column;gap:3px}
.msg{font-size:11px;line-height:1.55;padding:2px 0;max-width:92%}
.msg.user{color:var(--cyan);align-self:flex-end;text-align:right}
.msg.user::before{content:'YOU: ';font-size:9px;color:var(--dim)}
.msg.ai{color:var(--text)}
.msg.ai::before{content:'MONIR // ';color:var(--gold);font-size:9px}
.msg.sys{color:var(--dim);font-size:9px;align-self:center;font-style:italic}
#chat-bar{display:flex;gap:5px;padding:6px 10px;background:var(--panel);border-top:1px solid var(--border);align-items:center;flex-shrink:0}
#chat-in{flex:1;height:34px;background:rgba(255,255,255,.03)}
.cbtn{height:34px;padding:0 10px;font-size:10px;white-space:nowrap;letter-spacing:1px}
#btn-kart{border-color:var(--gold);color:var(--gold)}
#btn-kart:hover{background:var(--gold);color:var(--bg)}
#btn-send{border-color:var(--cyan);color:var(--cyan)}
#btn-send:hover{background:var(--cyan);color:var(--bg)}
#btn-voice.on{border-color:var(--red);color:var(--red);animation:pulse 1s infinite}
#btn-leg{border-color:var(--dim);color:var(--dim);font-size:9px}
#btn-leg:hover{border-color:var(--text);color:var(--text)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.xpfloat{position:fixed;pointer-events:none;color:var(--gold);font-size:13px;font-weight:bold;animation:fup 1.4s forwards;z-index:500}
@keyframes fup{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-55px)}}
#lvlup{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--gold);color:var(--bg);font-size:22px;letter-spacing:6px;padding:18px 36px;z-index:600;animation:pop .35s ease;pointer-events:none}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.4)}100%{transform:translate(-50%,-50%) scale(1)}}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:var(--border)}
</style>
</head>
<body>

<!-- BOOT -->
<div id="boot">
  <div id="boot-text"></div>
  <div id="boot-bar"><div id="boot-fill"></div></div>
</div>

<!-- ONBOARDING OVERLAY -->
<div id="ob-overlay" class="hidden">
  <div id="ob-box">
    <div id="ob-title">MONIR KARTLEGGING</div>
    <div id="ob-sub">LIFE OS v3 // INITIALISERING</div>
    <div id="ob-pips"></div>
    <div id="ob-body"></div>
    <div id="ob-footer">
      <button id="ob-prev">‹ TILBAKE</button>
      <span id="ob-info"></span>
      <button id="ob-next">NESTE ›</button>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <div id="hdr">
    <div id="hdr-name">MONIR</div>
    <div class="sep">//</div>
    <div id="hdr-lvl">LVL 1</div>
    <div id="xp-wrap">
      <div id="xp-bg"><div id="xp-fill"></div></div>
      <div id="xp-txt">0 / 1000 XP</div>
    </div>
    <div id="hdr-city">Oslo</div>
    <div class="sep">//</div>
    <div id="hdr-time">00:00</div>
  </div>

  <div id="main">
    <!-- LEFT: Stats + Rep -->
    <div id="left">
      <div class="ptitle">STATS</div>
      <div class="statrow"><span class="slabel">DISIPLIN</span><div class="sbg"><div class="sfill" id="s-dis" style="background:var(--cyan);width:0%"></div></div><span class="sval" id="sv-dis">—</span></div>
      <div class="statrow"><span class="slabel">INTELLIGENS</span><div class="sbg"><div class="sfill" id="s-int" style="background:#a78bfa;width:0%"></div></div><span class="sval" id="sv-int">—</span></div>
      <div class="statrow"><span class="slabel">HELSE</span><div class="sbg"><div class="sfill" id="s-hel" style="background:var(--green);width:0%"></div></div><span class="sval" id="sv-hel">—</span></div>
      <div class="statrow"><span class="slabel">BUSINESS</span><div class="sbg"><div class="sfill" id="s-biz" style="background:var(--gold);width:0%"></div></div><span class="sval" id="sv-biz">—</span></div>
      <div class="ptitle" style="margin-top:14px">REPUTATION</div>
      <div class="reprow"><span class="rlabel">BUILDER</span><span class="stars" id="r-bld">☆☆☆☆☆</span></div>
      <div class="reprow"><span class="rlabel">TEKNIKER</span><span class="stars" id="r-tec">☆☆☆☆☆</span></div>
      <div class="reprow"><span class="rlabel">GRÜNDER</span><span class="stars" id="r-ent">☆☆☆☆☆</span></div>
      <div class="reprow"><span class="rlabel">UTØVER</span><span class="stars" id="r-ath">☆☆☆☆☆</span></div>
      <div class="reprow"><span class="rlabel">LEDER</span><span class="stars" id="r-lea">☆☆☆☆☆</span></div>
    </div>

    <!-- CENTER: Figure + Priority -->
    <div id="center">
      <div id="fig-wrap">
        <svg id="stick-fig" viewBox="0 0 120 220" width="90" height="180">
          <circle id="f-head" cx="60" cy="28" r="16" fill="none" stroke="#00ff7f" stroke-width="2.5"/>
          <line id="f-neck" x1="60" y1="44" x2="60" y2="56" stroke="#00ff7f" stroke-width="2.5" stroke-linecap="round"/>
          <line id="f-body" x1="60" y1="56" x2="60" y2="118" stroke="#00ff7f" stroke-width="2.5" stroke-linecap="round"/>
          <line id="f-larm" x1="60" y1="72" x2="28" y2="98" stroke="#00ff7f" stroke-width="2.5" stroke-linecap="round"/>
          <line id="f-rarm" x1="60" y1="72" x2="92" y2="98" stroke="#00ff7f" stroke-width="2.5" stroke-linecap="round"/>
          <line id="f-lleg" x1="60" y1="118" x2="36" y2="172" stroke="#00ff7f" stroke-width="2.5" stroke-linecap="round"/>
          <line id="f-rleg" x1="60" y1="118" x2="84" y2="172" stroke="#00ff7f" stroke-width="2.5" stroke-linecap="round"/>
          <circle cx="60" cy="28" r="3" fill="#00ff7f" opacity=".35"/>
        </svg>
        <div id="fig-label">IDLE</div>
      </div>
      <div id="pri-box">
        <div id="pri-out" style="color:var(--dim);font-size:10px">// Klikk PRIORITER for AI-analyse av fokus og empire</div>
        <div id="pri-foot"><button id="btn-pri">⚡ PRIORITER</button></div>
      </div>
    </div>

    <!-- RIGHT: Tabs -->
    <div id="right">
      <div id="tabs">
        <button class="tbtn active" data-t="quest">QUEST</button>
        <button class="tbtn" data-t="empire">EMPIRE</button>
        <button class="tbtn" data-t="assets">ASSETS</button>
      </div>
      <div id="tab-c"></div>
    </div>
  </div>

  <!-- CHAT -->
  <div id="chat-s">
    <div id="msgs"></div>
    <div id="chat-bar">
      <button class="cbtn" id="btn-kart">KARTLEGG</button>
      <input id="chat-in" type="text" placeholder="Skriv til MONIR...">
      <button class="cbtn" id="btn-voice">🎙</button>
      <button class="cbtn" id="btn-send">SEND</button>
      <button class="cbtn" id="btn-leg">⚖ JUS</button>
    </div>
  </div>
</div>

<script>
// ── STATE ──────────────────────────────────────
const S = {
  char:null, habits:[], quests:[], businesses:[], assets:[],
  activeTab:'quest', figState:'idle', figTimer:0, listening:false,
  ob:{step:0, data:{}}
};
const STEPS = 9;
const stepTitles = ['IDENTITET','KROPP','STATS','MAIN QUEST','MILESTONES','EMPIRE','EIENDELER','VANER','ACHIEVEMENTS'];

// ── BOOT ───────────────────────────────────────
async function boot() {
  const el = document.getElementById('boot-text');
  const fill = document.getElementById('boot-fill');
  const lines = ['MONIR LIFE OS v3.0','━━━━━━━━━━━━━━━━━','> Initialiserer...','> Laster profil...','> AI-motor klar.','> System OK.'];
  for (let i=0; i<lines.length; i++) {
    el.textContent += lines[i]+'\n';
    fill.style.width = ((i+1)/lines.length*100)+'%';
    await wait(i===0?380:140);
  }
  await wait(350);
  const b = document.getElementById('boot');
  b.style.transition='opacity .4s'; b.style.opacity='0';
  await wait(400); b.classList.add('hidden');
  await initApp();
}

async function initApp() {
  try { S.char = await fetch('/api/character').then(r=>r.json()); }
  catch(e) { S.char = {onboarded:false}; }
  if (!S.char.onboarded) startOnboarding();
  else showApp();
}

async function showApp() {
  document.getElementById('app').classList.remove('hidden');
  renderHeader();
  await loadAll();
  renderTab(S.activeTab);
  startFigure();
  startClock();
  sysMsg('MONIR LIFE OS v3 — System klar.');
}

async function loadAll() {
  const [h,q,b,a] = await Promise.all([
    fetch('/api/habits').then(r=>r.json()).catch(()=>({habits:[]})),
    fetch('/api/quests').then(r=>r.json()).catch(()=>({quests:[]})),
    fetch('/api/businesses').then(r=>r.json()).catch(()=>({businesses:[]})),
    fetch('/api/assets').then(r=>r.json()).catch(()=>({assets:[]}))
  ]);
  S.habits = h.habits||[]; S.quests = q.quests||[];
  S.businesses = b.businesses||[]; S.assets = a.assets||[];
}

// ── HEADER ─────────────────────────────────────
function renderHeader() {
  const c = S.char||{};
  document.getElementById('hdr-name').textContent = (c.name||'MONIR').toUpperCase()+' // LIFE OS';
  document.getElementById('hdr-lvl').textContent = 'LVL '+(c.level||1);
  document.getElementById('hdr-city').textContent = c.city||'Oslo';
  const pct = c.xp_next>0 ? Math.min(100,(c.xp/c.xp_next)*100) : 0;
  document.getElementById('xp-fill').style.width = pct+'%';
  document.getElementById('xp-txt').textContent = `${c.xp||0} / ${c.xp_next||1000} XP`;
  [['s-dis','sv-dis',c.discipline||0],['s-int','sv-int',c.intelligence||0],
   ['s-hel','sv-hel',c.health||0],['s-biz','sv-biz',c.business_score||0]].forEach(([b,v,val])=>{
    document.getElementById(b).style.width=val+'%';
    document.getElementById(v).textContent=val;
  });
  [['r-bld',c.rep_builder||0],['r-tec',c.rep_tech||0],['r-ent',c.rep_entrepreneur||0],
   ['r-ath',c.rep_athlete||0],['r-lea',c.rep_leader||0]].forEach(([id,val])=>{
    document.getElementById(id).textContent='★'.repeat(val)+'☆'.repeat(5-val);
  });
}

// ── TABS ───────────────────────────────────────
document.addEventListener('click', e=>{
  const t = e.target.closest('.tbtn');
  if(t){ document.querySelectorAll('.tbtn').forEach(b=>b.classList.remove('active')); t.classList.add('active'); S.activeTab=t.dataset.t; renderTab(t.dataset.t); }
});

function renderTab(name) {
  const c = document.getElementById('tab-c');
  if(name==='quest') c.innerHTML = renderQuestTab();
  else if(name==='empire') c.innerHTML = renderEmpireTab();
  else c.innerHTML = renderAssetsTab();
  if(name==='quest') bindQuestTab();
}

function renderQuestTab() {
  const ch = S.char||{};
  const prog = ch.main_quest_progress||0;
  let h = `<div class="mqtitle">${ch.main_quest||'—'}</div>
<div class="mqbar"><div class="sbg" style="flex:1;height:4px"><div class="sfill" style="width:${prog}%;background:var(--gold)"></div></div><span class="mqpct">${prog}%</span></div>`;
  if(S.quests.length){
    h+='<div class="sec-t">MILEPÆLER</div>';
    S.quests.forEach(q=>{h+=`<div class="mile${q.completed?' done':''}" data-qid="${q.id}"><input type="checkbox" ${q.completed?'checked':''} id="q${q.id}"><label for="q${q.id}">${q.title}</label></div>`;});
  }
  if(S.habits.length){
    h+='<div class="sec-t">DAGLIGE VANER</div>';
    S.habits.forEach(hb=>{h+=`<div class="hrow${hb.done_today?' done':''}" data-hid="${hb.id}"><div class="hcheck">${hb.done_today?'✓':''}</div><span class="hname">${hb.emoji||'⚡'} ${hb.name}</span><span class="hxp">+${hb.xp_reward||20}XP</span></div>`;});
  }
  return h;
}

function renderEmpireTab() {

async function runPriority() {
  const out=document.getElementById('pri-out'), btn=document.getElementById('btn-pri');
  out.textContent=''; out.style.color='var(--text)';
  btn.disabled=true; btn.textContent='⚡ ANALYSERER...';
  setFigState('think');
  try {
    const resp = await fetch('/api/priority',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({context:''})});
    const reader=resp.body.getReader(), dec=new TextDecoder(); let buf='';
    while(true){
      const {done,value}=await reader.read(); if(done) break;
      buf+=dec.decode(value,{stream:true});
      const parts=buf.split('\n\n'); buf=parts.pop();
      for(const p of parts){ if(!p.startsWith('data:')) continue; try{ const d=JSON.parse(p.slice(5).trim()); if(d.t==='text'){out.textContent+=d.v;out.scrollTop=out.scrollHeight;} }catch(e){} }
    }
  } catch(e){ out.textContent='// Feil ved analyse.'; }
  btn.disabled=false; btn.textContent='⚡ PRIORITER';
  setFigState('idle');
}

      const parts=buf.split('\n\n'); buf=parts.pop();

    }

async function sendLegal() {

    const reader=resp.body.getReader(), dec=new TextDecoder(); let buf='';

      buf+=dec.decode(value,{stream:true});
      const parts=buf.split('\n\n'); buf=parts.pop();
      for(const p of parts){ if(!p.startsWith('data:')) continue; try{

const POSES={
  idle:  {la:[60,72,28,98], ra:[60,72,92,98], ll:[60,118,36,172], rl:[60,118,84,172]},
  wave:  {la:[60,72,25,52], ra:[60,72,100,52], ll:[60,118,36,172], rl:[60,118,84,172]},
  think: {la:[60,72,28,98], ra:[60,72,78,58], ll:[60,118,36,172], rl:[60,118,84,172]},
  pose:  {la:[60,72,18,62], ra:[60,72,102,62], ll:[60,118,28,178], rl:[60,118,92,178]},
  lean:  {la:[60,72,20,102], ra:[60,72,90,96], ll:[60,118,28,172], rl:[60,118,80,172]}
};
let figCur={...POSES.idle}, figTgt={...POSES.idle}, figAnimId=null, figBreath=0, figTimerCount=0;

function setFigState(s){
  S.figState=s; figTgt={...POSES[s]||POSES.idle};
  document.getElementById('fig-label').textContent=s.toUpperCase();
}
function lp(a,b,t){return a+(b-a)*t}

function figTick(ts){
  figBreath=Math.sin(ts/1200)*3;
  const sp=0.06;
  ['la','ra','ll','rl'].forEach(k=>{
    figCur[k]=figCur[k].map((v,i)=>lp(v,figTgt[k][i],sp));
  });
  if(S.figState==='idle'){
    figCur.la[1]=lp(figCur.la[1],72+figBreath,0.1);
    figCur.ra[1]=lp(figCur.ra[1],72+figBreath,0.1);
  }
  const map={la:'f-larm',ra:'f-rarm',ll:'f-lleg',rl:'f-rleg'};
  Object.entries(map).forEach(([k,id])=>{
    const el=document.getElementById(id),v=figCur[k];
    if(el){el.setAttribute('x1',v[0].toFixed(1));el.setAttribute('y1',v[1].toFixed(1));el.setAttribute('x2',v[2].toFixed(1));el.setAttribute('y2',v[3].toFixed(1));}
  });
  const head=document.getElementById('f-head');
  if(head) head.setAttribute('cy',(28+Math.sin(ts/1800)*1.5).toFixed(2));
  figTimerCount++;
  if(figTimerCount>280&&S.figState==='idle'){
    figTimerCount=0;
    const states=['idle','idle','wave','pose','lean','think'];
    const next=states[Math.floor(Math.random()*states.length)];
    setFigState(next);
    if(next!=='idle') setTimeout(()=>setFigState('idle'),3200);
  }
  figAnimId=requestAnimationFrame(figTick);
}
function startFigure(){ if(figAnimId) cancelAnimationFrame(figAnimId); figAnimId=requestAnimationFrame(figTick); }

function attachList(listId, key, addId, tpl){

  list.addEventListener('click',e=>{ if(e.target.dataset.ri!==undefined){S.ob.data[key].splice(+e.target.dataset.ri,1);renderObStep();} });
  document.getElementById(addId)?.addEventListener('click',()=>{ S.ob.data[key].push({...tpl}); renderObStep(); setTimeout(()=>{ const items=list.querySelectorAll('li'); if(items.length) items[items.length-1].querySelector('input[type=text]')?.focus(); },50); });

  saveObStep();
  if(S.ob.step===0&&!S.ob.data.name){ alert('Skriv inn navn for å fortsette.'); return; }
  if(S.ob.step<STEPS-1){ S.ob.step++; renderObStep(); }
  else await submitOnboarding();
});

document.getElementById('ob-prev').addEventListener('click',()=>{ saveObStep(); if(S.ob.step>0){S.ob.step--;renderObStep();} });

async function submitOnboarding(){
  const btn=document.getElementById('ob-next');
  btn.textContent='LAGRER...'; btn.disabled=true;
  try {
    const r=await fetch('/api/onboarding/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(S.ob.data)});
    const res=await r.json();
    document.getElementById('ob-overlay').classList.add('hidden');
    S.char=await fetch('/api/character').then(r=>r.json());
    showApp();
    sysMsg(`MONIR AKTIVERT // LVL ${res.level} // SYSTEM KLAR`);
    setFigState('wave'); setTimeout(()=>setFigState('idle'),3000);
  } catch(e){
    btn.textContent='START MONIR ›'; btn.disabled=false;
    alert('Feil ved lagring. Prøv igjen.');
  }
}

// ── UTILS ──────────────────────────────────────
function wait(ms){ return new Promise(r=>setTimeout(r,ms)); }

// ── LAUNCH ─────────────────────────────────────
boot();
</script>
