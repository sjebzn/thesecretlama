<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MONIR // LIFE OS</title>
<style>
:root{
  --bg:#111114;--panel:#18181b;--panel2:#1f1f23;--border:#2a2a30;
  --text:#e4e4e7;--dim:#52525b;--dim2:#71717a;
  --green:#4ade80;--blue:#38bdf8;--purple:#a78bfa;--orange:#fb923c;--yellow:#fbbf24;
  --f:'Courier New',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--f);font-size:13px}
button{background:transparent;border:1px solid var(--border);color:var(--text);cursor:pointer;font-family:var(--f);font-size:11px;padding:5px 10px;transition:all .15s}
button:hover{border-color:var(--green);color:var(--green)}
input,select,textarea{background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--text);font-family:var(--f);font-size:12px;padding:7px 10px;outline:none;width:100%}
input:focus,select:focus{border-color:var(--blue)}
input[type=range]{padding:0;cursor:pointer;accent-color:var(--blue)}
input[type=checkbox]{accent-color:var(--green);cursor:pointer;width:auto}
select option{background:var(--panel)}
.hidden{display:none!important}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:var(--border)}

/* ── BOOT ── */
#boot{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px}
#boot-text{color:var(--green);font-size:12px;line-height:1.9;white-space:pre;opacity:.9}
#boot-bar{width:220px;height:1px;background:var(--dim)}
#boot-fill{height:100%;background:var(--green);width:0;transition:width .07s}

/* ── ONBOARDING ── */
#ob-overlay{position:fixed;inset:0;background:rgba(17,17,20,.97);z-index:50;display:flex;align-items:center;justify-content:center;overflow-y:auto;padding:20px}
#ob-box{width:min(540px,96vw);border:1px solid var(--border);background:var(--panel);padding:28px 30px;border-radius:4px}
#ob-title{color:var(--green);font-size:14px;letter-spacing:4px}
#ob-sub{color:var(--dim2);font-size:10px;letter-spacing:2px;margin:4px 0 16px}
#ob-pips{display:flex;gap:4px;margin-bottom:16px}
.pip{height:2px;flex:1;background:var(--dim)}.pip.done{background:var(--green)}.pip.active{background:var(--blue)}
#ob-body{min-height:190px}
.obl{color:var(--dim2);font-size:10px;letter-spacing:1px;display:block;margin:12px 0 5px}
.ob-row{display:flex;gap:10px}.ob-row>div{flex:1}
.sr{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.sr>label{width:110px;font-size:10px;color:var(--dim2);flex-shrink:0}
.sr input[type=range]{flex:1}.sr>span{width:26px;text-align:right;color:var(--blue);font-size:12px}
.ob-list{list-style:none}
.ob-list li{display:flex;gap:6px;margin-bottom:6px;align-items:center}
.ob-list li .lt{flex:1}.ob-list li .ls{width:55px;flex-shrink:0}.ob-list li .le{width:36px;flex-shrink:0}.ob-list li .lx{width:52px;flex-shrink:0}
.ob-list li .rm{padding:2px 6px;color:#ef4444;border-color:#ef4444;font-size:10px;flex-shrink:0}
.ob-add{color:var(--green);border-color:var(--green);font-size:10px;padding:3px 10px;margin-top:6px;border-radius:2px}
#ob-footer{display:flex;justify-content:space-between;align-items:center;margin-top:20px;padding-top:14px;border-top:1px solid var(--border)}
#ob-step-label{color:var(--dim2);font-size:10px}
.ob-btn{padding:7px 22px;font-size:11px;letter-spacing:1px}
.ob-btn.primary{border-color:var(--green);color:var(--green)}
.ob-btn.primary:hover{background:rgba(74,222,128,.1)}

/* ── APP GRID ── */
#app{
  display:grid;
  grid-template-rows:44px 1fr 148px;
  grid-template-columns:200px 1fr 260px;
  grid-template-areas:"hdr hdr hdr" "left center right" "chat chat chat";
  height:100vh;
}

/* ── HEADER ── */
#hdr{
  grid-area:hdr;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;border-bottom:1px solid var(--border);
  background:var(--panel);
}
#hdr-logo{color:var(--green);font-size:13px;letter-spacing:4px;font-weight:bold}
#hdr-right{display:flex;align-items:center;gap:12px}
#hdr-level{color:var(--blue);font-size:11px}
#hdr-xp-bar{width:80px;height:3px;background:var(--border);border-radius:2px}
#hdr-xp-fill{height:100%;background:var(--blue);border-radius:2px;width:0;transition:width .4s}
#hdr-name{color:var(--dim2);font-size:10px;letter-spacing:1px}
#hdr-time{color:var(--dim);font-size:10px}

/* ── LEFT PANEL ── */
#left{
  grid-area:left;
  border-right:1px solid var(--border);
  overflow-y:auto;padding:14px 12px;
  display:flex;flex-direction:column;gap:16px;
}
.sec-label{font-size:9px;letter-spacing:2px;color:var(--dim2);margin-bottom:8px;text-transform:uppercase}

.stat-row{margin-bottom:8px}
.stat-top{display:flex;justify-content:space-between;margin-bottom:3px}
.stat-name{font-size:10px;color:var(--dim2)}
.stat-val{font-size:10px}
.stat-bar{height:3px;background:var(--border);border-radius:2px}
.stat-fill{height:100%;border-radius:2px;transition:width .5s}

.rep-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.rep-name{font-size:10px;color:var(--dim2);width:80px}
.rep-stars{display:flex;gap:2px}
.star{font-size:11px;opacity:.25}.star.on{opacity:1}

#quest-name{font-size:11px;color:var(--yellow);margin-bottom:6px;line-height:1.3}
#quest-bar-wrap{height:4px;background:var(--border);border-radius:2px}
#quest-fill{height:100%;background:var(--yellow);border-radius:2px;width:0;transition:width .5s}
#quest-pct{font-size:9px;color:var(--dim2);margin-top:4px}

/* ── CENTER ── */
#center{
  grid-area:center;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  position:relative;overflow:hidden;
}
#main-svg{width:240px;height:290px;overflow:visible}

/* ── RIGHT PANEL ── */
#right{
  grid-area:right;
  border-left:1px solid var(--border);
  overflow-y:auto;padding:14px 12px;
  display:flex;flex-direction:column;gap:16px;
}
#today-date{font-size:10px;color:var(--dim2);letter-spacing:1px}

.habit-card{
  display:flex;align-items:center;gap:8px;
  padding:8px 10px;border:1px solid var(--border);border-radius:3px;
  cursor:pointer;transition:all .15s;margin-bottom:6px;
  background:var(--panel2);
}
.habit-card:hover{border-color:var(--green)}
.habit-card.hc-done{opacity:.45;border-color:var(--dim)}
.hc-circle{
  width:18px;height:18px;border:1.5px solid var(--dim);border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:10px;
  flex-shrink:0;transition:all .2s;color:var(--green);
}
.hc-done .hc-circle{background:rgba(74,222,128,.15);border-color:var(--green)}
.hc-emoji{font-size:14px;flex-shrink:0}
.hc-info{flex:1;min-width:0}
.hc-name{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hc-meta{display:flex;gap:6px;margin-top:2px}
.hc-xp{font-size:9px;color:var(--green)}
.hc-streak{font-size:9px;color:var(--orange)}

.emp-item{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.emp-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.emp-name{font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ── CHAT ── */
#chat{
  grid-area:chat;
  border-top:1px solid var(--border);
  background:var(--panel);
  display:flex;flex-direction:column;
  min-height:0;
}
#msgs{
  flex:1;overflow-y:auto;padding:8px 16px;
  display:flex;flex-direction:column;gap:5px;
  min-height:0;
}
.msg{font-size:12px;line-height:1.55;padding:4px 0}
.msg.user{color:var(--blue)}
.msg.ai{color:var(--text)}
.msg.sys{color:var(--dim2);font-size:10px;font-style:italic}
.msg.lvlup{color:var(--yellow);font-weight:bold}
#chat-bottom{padding:6px 10px 8px;display:flex;flex-direction:column;gap:5px;flex-shrink:0}
#chat-input-row{display:flex;gap:6px}
#chat-in{flex:1;font-size:12px;background:rgba(255,255,255,.04);border:1px solid var(--border);color:var(--text);padding:6px 10px;font-family:var(--f)}
#chat-in:focus{border-color:var(--blue)}
#btn-send{border-color:var(--blue);color:var(--blue);padding:6px 16px;font-size:11px}
#btn-send:hover{background:rgba(56,189,248,.1)}
#btn-voice{padding:6px 10px;font-size:14px}
#btn-voice.listening{border-color:var(--orange);color:var(--orange);animation:pulse .7s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
#chat-act-row{display:flex;gap:5px;flex-wrap:wrap}
.cact{font-size:10px;padding:4px 10px;letter-spacing:.5px}
#cact-kart{border-color:var(--purple);color:var(--purple)}
#cact-kart:hover{background:rgba(167,139,250,.1)}
#cact-pri{border-color:var(--orange);color:var(--orange)}
#cact-pri:hover{background:rgba(251,146,60,.1)}
#cact-jus{border-color:var(--yellow);color:var(--yellow)}
#cact-jus:hover{background:rgba(251,191,36,.1)}
</style>
</head>
<body>

<!-- BOOT -->
<div id="boot">
  <div id="boot-text">MONIR // LIFE OS
INITIALISERER...</div>
  <div id="boot-bar"><div id="boot-fill"></div></div>
</div>

<!-- ONBOARDING -->
<div id="ob-overlay" class="hidden">
  <div id="ob-box">
    <div id="ob-title">MONIR // KARTLEGGING</div>
    <div id="ob-sub">SETT OPP DIN PROFIL</div>
    <div id="ob-pips"></div>
    <div id="ob-body"></div>
    <div id="ob-footer">

<!-- APP -->
<div id="app" class="hidden">

  <!-- HEADER -->
  <div id="hdr">
    <div id="hdr-logo">◈ MONIR</div>
    <div id="hdr-right">
      <span id="hdr-level">LVL 1</span>
      <div id="hdr-xp-bar"><div id="hdr-xp-fill"></div></div>
      <span id="hdr-name">—</span>
      <span id="hdr-time">—</span>
    </div>
  </div>

  <!-- LEFT -->
  <div id="left">
    <div>
      <div class="sec-label">STATS</div>

    </div>
    <div>
      <div class="sec-label">RYKTE</div>
      <div id="rep-list"></div>
    </div>
    <div>
      <div class="sec-label">MAIN QUEST</div>
      <div id="quest-name">—</div>

  <!-- CENTER: stickman -->
  <div id="center">

      <path d="M47,254 L47,268 Q120,283 193,268 L193,254" fill="#0f0f12" stroke="#2a2a30" stroke-width="1"/>

      <g id="fig-group" stroke="#4ade80" stroke-linecap="round" stroke-width="2.5" fill="none">

        <line id="fig-body" x1="120" y1="151" x2="120" y2="210"/>
        <line id="fig-la" x1="120" y1="162" x2="82" y2="192"/>
        <line id="fig-ra" x1="120" y1="162" x2="158" y2="192"/>
        <line id="fig-ll" x1="120" y1="210" x2="97" y2="252"/>

  <!-- RIGHT -->

<script>
// ═══════════════════════════════════
// STICKMAN ANIMATION
// ═══════════════════════════════════
const POSES={
  idle:{la:[120,162,82,192],ra:[120,162,158,192],ll:[120,210,97,252],rl:[120,210,143,252]},
  wave:{la:[120,162,75,128],ra:[120,162,168,130],ll:[120,210,97,252],rl:[120,210,143,252]},
  think:{la:[120,162,82,192],ra:[120,162,152,148],ll:[120,210,97,252],rl:[120,210,143,252]},
  pose:{la:[120,162,68,150],ra:[120,162,172,150],ll:[120,210,88,252],rl:[120,210,152,252]},
  lean:{la:[120,162,75,200],ra:[120,162,165,196],ll:[120,210,95,252],rl:[120,210,148,252]}
};
const POSE_SEQ=['idle','idle','idle','wave','idle','think','idle','pose','idle','lean'];
let poseIdx=0;
let cur={la:[...POSES.idle.la],ra:[...POSES.idle.ra],ll:[...POSES.idle.ll],rl:[...POSES.idle.rl]};
let tgt={la:[...POSES.idle.la],ra:[...POSES.idle.ra],ll:[...POSES.idle.ll],rl:[...POSES.idle.rl]};
let lastPoseChange=0;

// Forced pose state (overrides normal sequence)
let forcedPoseName=null;
let forcedPoseUntil=0;
let nodeSpeedMult=1;
let typingTimer=null;

function forcePose(name,ms){
  forcedPoseName=name;
  forcedPoseUntil=performance.now()+ms;
  const p=POSES[name]||POSES.idle;
  tgt.la=[...p.la];tgt.ra=[...p.ra];tgt.ll=[...p.ll];tgt.rl=[...p.rl];
}

function clearForcedPose(){
  forcedPoseName=null;
  forcedPoseUntil=0;
}

function lerp(a,b,t){return a+(b-a)*t}
function setLimb(id,coords){
  const el=document.getElementById(id);
  if(!el)return;
  el.setAttribute('x1',coords[0]);el.setAttribute('y1',coords[1]);
  el.setAttribute('x2',coords[2]);el.setAttribute('y2',coords[3]);
}
function animLoop(ts){
  const now=performance.now();
  if(forcedPoseName&&now<forcedPoseUntil){
    // hold forced pose
    const p=POSES[forcedPoseName]||POSES.idle;
    tgt.la=[...p.la];tgt.ra=[...p.ra];tgt.ll=[...p.ll];tgt.rl=[...p.rl];
    lastPoseChange=ts; // prevent normal sequence takeover
  } else {
    if(forcedPoseName&&now>=forcedPoseUntil) forcedPoseName=null;
    if(ts-lastPoseChange>3200){
      poseIdx=(poseIdx+1)%POSE_SEQ.length;
      const p=POSE_SEQ[poseIdx];
      tgt.la=[...POSES[p].la];tgt.ra=[...POSES[p].ra];
      tgt.ll=[...POSES[p].ll];tgt.rl=[...POSES[p].rl];
      lastPoseChange=ts;
    }
  }
  const s=0.06;
  ['la','ra','ll','rl'].forEach(k=>{
    for(let i=0;i<4;i++) cur[k][i]=lerp(cur[k][i],tgt[k][i],s);
  });
  setLimb('fig-la',cur.la);setLimb('fig-ra',cur.ra);
  setLimb('fig-ll',cur.ll);setLimb('fig-rl',cur.rl);
  requestAnimationFrame(animLoop);
}
requestAnimationFrame(animLoop);

function updateFigureForLevel(lvl){
  const sw=Math.min(4.5,2.5+lvl*0.06);
  const col=lvl<15?'#4ade80':lvl<30?'#38bdf8':lvl<50?'#a78bfa':'#fb923c';
  const glow=Math.min(6,3+lvl*0.1);
  document.querySelectorAll('#fig-group line,#fig-group circle').forEach(el=>{
    el.setAttribute('stroke',col);
  });
  document.querySelectorAll('#fig-group circle[fill="#111114"]').forEach(el=>{
    el.setAttribute('stroke',col);
    el.setAttribute('stroke-width',sw);
  });
  document.querySelectorAll('#fig-group line').forEach(el=>{
    el.setAttribute('stroke-width',sw);
  });
  const eyes=document.querySelectorAll('#fig-group circle[fill]');
  eyes.forEach(e=>{if(e.getAttribute('fill')!=='#111114')e.setAttribute('fill',col)});
  document.getElementById('main-svg').style.filter=`drop-shadow(0 0 ${glow}px ${col}44)`;
  document.getElementById('plat-glow').setAttribute('stroke',col);
  document.getElementById('plat-glow').setAttribute('fill',col.replace('#','rgba(').replace(')',',0.06)'));
  setUniverseColor(col);
}

// ═══════════════════════════════════
// UNIVERSE DATA THREADS
// ═══════════════════════════════════
let uCol='#4ade80';

const DATA_LABELS=[
  'HELSE','XP','FOKUS','KR','SØVN','STEG','VEKT','PULS',
  'ENERGI','MOØD','DATA','SIGNAL','MINNE','TEMP','REPS','H2O',
  'KODE','BIZ','PLAN','LOKASJON','KOST','STYRKE','SPEED'
];

const THREADS=[];
const THREAD_COUNT=8;
const DATA_NODES=[];
const ABSORB_FLASHES=[];

function hexToRgb(hex){
  return{r:parseInt(hex.slice(1,3),16),g:parseInt(hex.slice(3,5),16),b:parseInt(hex.slice(5,7),16)};
}

function getCanvasCenter(){
  const cnv=document.getElementById('universe-canvas');
  const svgEl=document.getElementById('main-svg');
  if(!cnv||!svgEl)return{cx:0,cy:0};
  const sr=svgEl.getBoundingClientRect();
  const cr=cnv.getBoundingClientRect();
  return{
    cx:sr.left-cr.left+sr.width/2,
    cy:sr.top-cr.top+sr.height*(138/290)
  };
}

function initThreads(){
  THREADS.length=0;
  for(let i=0;i<THREAD_COUNT;i++){
    const baseAngle=(Math.PI*2/THREAD_COUNT)*i;
    THREADS.push({
      angle:baseAngle+Math.random()*0.5-0.25,
      drift:(Math.random()-0.5)*0.003,
      len:80+Math.random()*80,
      maxLen:140+Math.random()*160,
      spawnTimer:Math.floor(Math.random()*120)
    });
  }
}

function spawnDataNode(t,cx,cy,customLabel){
  const tipX=cx+Math.cos(t.angle)*t.len;
  const tipY=cy+Math.sin(t.angle)*t.len;
  DATA_NODES.push({
    x:tipX,y:tipY,
    tx:cx,ty:cy,
    label:customLabel||DATA_LABELS[Math.floor(Math.random()*DATA_LABELS.length)],
    progress:0,
    speed:0.008+Math.random()*0.006,
    startX:tipX,startY:tipY,
    isWord:!!customLabel
  });
}

// Inject specific words as fast-moving data nodes from random directions
function injectWordNodes(words){
  const {cx,cy}=getCanvasCenter();
  words.filter(w=>w.length>1).slice(0,6).forEach((word,i)=>{
    setTimeout(()=>{
      const angle=Math.random()*Math.PI*2;
      const dist=100+Math.random()*80;
      DATA_NODES.push({
        x:cx+Math.cos(angle)*dist,
        y:cy+Math.sin(angle)*dist,
        tx:cx,ty:cy,
        label:word.toUpperCase().slice(0,10),
        progress:0,
        speed:0.022+Math.random()*0.01,
        startX:cx+Math.cos(angle)*dist,
        startY:cy+Math.sin(angle)*dist,
        isWord:true
      });
    },i*100);
  });
}

function drawUniverse(ts){
  const cnv=document.getElementById('universe-canvas');
  if(!cnv)return;
  const W=cnv.width,H=cnv.height;
  const ctx=cnv.getContext('2d');
  const {cx,cy}=getCanvasCenter();

  ctx.clearRect(0,0,W,H);
  const {r,g,b}=hexToRgb(uCol);

  // ── THREADS
  THREADS.forEach(t=>{
    t.angle+=t.drift;
    t.len=Math.min(t.maxLen,t.len+(0.3+Math.sin(ts/3000+t.angle)*0.2));
    const ex=cx+Math.cos(t.angle)*t.len;
    const ey=cy+Math.sin(t.angle)*t.len;

    const grad=ctx.createLinearGradient(cx,cy,ex,ey);
    grad.addColorStop(0,`rgba(${r},${g},${b},0.4)`);
    grad.addColorStop(0.6,`rgba(${r},${g},${b},0.15)`);
    grad.addColorStop(1,`rgba(${r},${g},${b},0)`);
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(ex,ey);
    ctx.strokeStyle=grad;ctx.lineWidth=0.8;ctx.stroke();

    const pulse=0.5+0.5*Math.sin(ts/600+t.angle*3);
    ctx.beginPath();ctx.arc(ex,ey,2+pulse,0,Math.PI*2);
    ctx.fillStyle=`rgba(${r},${g},${b},${0.3+pulse*0.4})`;
    ctx.fill();

    t.spawnTimer-=nodeSpeedMult;
    if(t.spawnTimer<=0){
      t.spawnTimer=80+Math.floor(Math.random()*100);
      spawnDataNode(t,cx,cy);
    }
  });

  // ── DATA NODES travelling inward
  for(let i=DATA_NODES.length-1;i>=0;i--){
    const n=DATA_NODES[i];
    n.progress+=n.speed;
    const lx=n.startX+(n.tx-n.startX)*n.progress;
    const ly=n.startY+(n.ty-n.startY)*n.progress;
    const dist=Math.hypot(lx-cx,ly-cy);
    if(dist<12||n.progress>=1){
      ABSORB_FLASHES.push({life:1,isWord:n.isWord});
      DATA_NODES.splice(i,1);
      continue;
    }
    const alpha=Math.min(1,n.progress*5)*Math.max(0,(dist-12)/40);
    ctx.font=`bold ${n.isWord?9:8}px monospace`;
    const tw=ctx.measureText(n.label).width;
    const pw=tw+8,ph=12;
    const px=lx-pw/2,py=ly-ph/2;
    // word nodes get a slightly brighter border
    const borderAlpha=n.isWord?Math.min(alpha*1.3,1):alpha*0.9;
    ctx.fillStyle=`rgba(17,17,20,${alpha*0.85})`;
    ctx.strokeStyle=`rgba(${r},${g},${b},${borderAlpha})`;
    ctx.lineWidth=n.isWord?1.2:0.8;
    ctx.beginPath();ctx.roundRect(px,py,pw,ph,3);
    ctx.fill();ctx.stroke();
    ctx.fillStyle=`rgba(${r},${g},${b},${alpha})`;
    ctx.fillText(n.label,lx-tw/2,ly+3.5);
    ctx.beginPath();ctx.arc(lx,ly-ph/2-2,1.5,0,Math.PI*2);
    ctx.fillStyle=`rgba(${r},${g},${b},${alpha*0.8})`;
    ctx.fill();
  }

  // ── ABSORB FLASHES
  for(let i=ABSORB_FLASHES.length-1;i>=0;i--){
    const f=ABSORB_FLASHES[i];
    f.life-=0.04;
    if(f.life<=0){ABSORB_FLASHES.splice(i,1);continue;}
    const rad=(f.isWord?8:6)+(1-f.life)*18;
    const grd=ctx.createRadialGradient(cx,cy,0,cx,cy,rad);
    grd.addColorStop(0,`rgba(${r},${g},${b},${f.life*(f.isWord?0.9:0.6)})`);
    grd.addColorStop(1,`rgba(${r},${g},${b},0)`);
    ctx.beginPath();ctx.arc(cx,cy,rad,0,Math.PI*2);
    ctx.fillStyle=grd;ctx.fill();
  }

  requestAnimationFrame(drawUniverse);
}

function startUniverse(){
  const cnv=document.getElementById('universe-canvas');
  if(!cnv)return;
  const resize=()=>{cnv.width=cnv.offsetWidth;cnv.height=cnv.offsetHeight;};
  resize();
  window.addEventListener('resize',resize);
  initThreads();
  requestAnimationFrame(drawUniverse);
}

    ob.city=(document.getElementById('ob-city')||{}).value||ob.city;

    ob.height_cm=+(document.getElementById('ob-h')||{}).value||ob.height_cm;
    ob.weight_kg=+(document.getElementById('ob-w')||{}).value||ob.weight_kg;
  }
  if(s.id==='stats'){
    ob.discipline=+(document.getElementById('ob-disc')||{}).value||ob.discipline;
    ob.intelligence=+(document.getElementById('ob-int')||{}).value||ob.intelligence;
    ob.health=+(document.getElementById('ob-hlt')||{}).value||ob.health;
    ob.business_score=+(document.getElementById('ob-biz')||{}).value||ob.business_score;

    ob.rep_tech=+(document.getElementById('ob-rt')||{}).value||ob.rep_tech;
    ob.rep_entrepreneur=+(document.getElementById('ob-re')||{}).value||ob.rep_entrepreneur;

let chatMode='normal';
function sysMsg(txt,cls='sys'){
  const d=document.createElement('div');
  d.className=`msg ${cls}`;d.textContent=txt;
  document.getElementById('msgs').appendChild(d);
  d.scrollIntoView({behavior:'smooth'});
}
function addMsg(role,text){
  const d=document.createElement('div');
  d.className=`msg ${role}`;d.textContent=text;
  document.getElementById('msgs').appendChild(d);
  d.scrollIntoView({behavior:'smooth'});
  return d;
}

async function sendMsg(text,mode){
  if(!text.trim()) return;
  document.getElementById('chat-in').value='';
  addMsg('user',text);

  // ── Stickman: wave on send, inject words as data nodes
  forcePose('wave',700);
  nodeSpeedMult=5;
  const words=text.split(/\s+/).filter(w=>w.length>2);
  injectWordNodes(words);
  setTimeout(()=>forcePose('think',9999999),750); // switch to think while waiting

  const el=addMsg('ai','');
  try{
    const r=await fetch('/api/chat',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({message:text,mode:mode||chatMode})
    });
    const reader=r.body.getReader();const dec=new TextDecoder();
    let buf='';
    while(true){
      const{done,value}=await reader.read();
      if(done)break;
      buf+=dec.decode(value,{stream:true});
      const lines=buf.split('\n');buf=lines.pop();
      for(const line of lines){
        if(!line.startsWith('data:'))continue;
        const raw=line.slice(5).trim();
        if(raw==='[DONE]')break;
        try{const j=JSON.parse(raw);if(j.t==='text')el.textContent+=j.v;}catch(_){}
      }
      el.scrollIntoView({behavior:'smooth'});
    }
  }catch(e){el.textContent='Tilkoblingsfeil.';}

  // ── Response done: victory pose then back to normal
  forcePose('pose',1400);
  setTimeout(()=>{clearForcedPose();nodeSpeedMult=1;},1500);
}

document.addEventListener('DOMContentLoaded',()=>{
  const inp=document.getElementById('chat-in');

  // Typing → think pose + faster nodes
  inp.addEventListener('input',()=>{
    if(inp.value.trim()){

      nodeSpeedMult=3;
      clearTimeout(typingTimer);
      typingTimer=setTimeout(()=>{nodeSpeedMult=1;},3000);
    }
  });

  document.getElementById('btn-send').onclick=()=>sendMsg(inp.value);

  document.getElementById('cact-kart').onclick=startOb;

    const q=inp.value.trim();
    if(q){sendMsg(q,'legal');inp.value='';}
    else sysMsg('Skriv et juridisk spørsmål og trykk ⚖ JUS','sys');
  };
  document.getElementById('cact-pri').onclick=async()=>{
    forcePose('think',9999999);
    nodeSpeedMult=4;
    const el=addMsg('ai','');
    try{
      const r=await fetch('/api/priority',{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({context:inp.value||''})
      });
      const reader=r.body.getReader();const dec=new TextDecoder();
      let buf='';
      while(true){
        const{done,value}=await reader.read();
        if(done)break;
        buf+=dec.decode(value,{stream:true});
        const lines=buf.split('\n');buf=lines.pop();
        for(const line of lines){
          if(!line.startsWith('data:'))continue;
          const raw=line.slice(5).trim();
          if(raw==='[DONE]')break;
          try{const j=JSON.parse(raw);if(j.t==='text')el.textContent+=j.v;}catch(_){}
        }
        el.scrollIntoView({behavior:'smooth'});
      }
    }catch(e){el.textContent='Feil.';}
    forcePose('pose',1200);

  // Voice
  const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(SpeechRecognition){
    const sr=new SpeechRecognition();
    sr.lang='nb-NO';sr.continuous=false;sr.interimResults=false;
    const btn=document.getElementById('btn-voice');
    btn.onclick=()=>{
      if(btn.classList.contains('listening')){sr.stop();btn.classList.remove('listening');return;}
      sr.start();btn.classList.add('listening');
      forcePose('think',9999999);
    };
    sr.onresult=e=>{
      const t=e.results[0][0].transcript;
      document.getElementById('chat-in').value=t;
      btn.classList.remove('listening');
      // inject spoken words
      injectWordNodes(t.split(/\s+/).filter(w=>w.length>2));
      nodeSpeedMult=3;
      setTimeout(()=>nodeSpeedMult=1,3000);
    };
    sr.onerror=()=>{btn.classList.remove('listening');clearForcedPose();};
    sr.onend=()=>btn.classList.remove('listening');
  } else {
    document.getElementById('btn-voice').style.display='none';
  }
});

const BOOT_LINES=[
  'MONIR // LIFE OS v3.0',
  'LASTER KARAKTER...',
  'KOBLER TIL AI-MOTOR...',
  'BYGGER EMPIRE...',
  'SYSTEM KLART'
];
async function boot(){
  const fill=document.getElementById('boot-fill');
  const txt=document.getElementById('boot-text');
  let i=0;
  for(const line of BOOT_LINES){
    await new Promise(r=>setTimeout(r,280));
    txt.textContent+='\n'+line;
    fill.style.width=`${Math.round((++i/BOOT_LINES.length)*100)}%`;
  }
  await new Promise(r=>setTimeout(r,400));
  document.getElementById('boot').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  await loadData();
  startUniverse();
  setInterval(()=>{
    const el=document.getElementById('hdr-time');
    if(el) el.textContent=new Date().toLocaleTimeString('no-NO',{hour:'2-digit',minute:'2-digit'});
  },30000);
  const now=new Date();
  const ms=(new Date(now.getFullYear(),now.getMonth(),now.getDate()+1)-now);
  setTimeout(()=>loadData(),ms);
}
boot();
</script>
