<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MONIR // LIFE OS</title>
<style>
:root{
  --bg:#111114;--panel:#18181b;--panel2:#1f1f23;--border:#2a2a30;
  --text:#e4e4e7;--dim:#52525b;--dim2:#71717a;
  --green:#4ade80;--blue:#38bdf8;--purple:#a78bfa;--orange:#fb923c;--yellow:#fbbf24;
  --f:'Courier New',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--f);font-size:13px}
button{background:transparent;border:1px solid var(--border);color:var(--text);cursor:pointer;font-family:var(--f);font-size:11px;padding:5px 10px;transition:all .15s}
button:hover{border-color:var(--green);color:var(--green)}
input,select,textarea{background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--text);font-family:var(--f);font-size:12px;padding:7px 10px;outline:none;width:100%}
input:focus,select:focus{border-color:var(--blue)}
input[type=range]{padding:0;cursor:pointer;accent-color:var(--blue)}
input[type=checkbox]{accent-color:var(--green);cursor:pointer;width:auto}
select option{background:var(--panel)}
.hidden{display:none!important}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:var(--border)}

/* ── BOOT ── */
#boot{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px}
#boot-text{color:var(--green);font-size:12px;line-height:1.9;white-space:pre;opacity:.9}
#boot-bar{width:220px;height:1px;background:var(--dim)}
#boot-fill{height:100%;background:var(--green);width:0;transition:width .07s}

/* ── ONBOARDING ── */
#ob-overlay{position:fixed;inset:0;background:rgba(17,17,20,.97);z-index:50;display:flex;align-items:center;justify-content:center;overflow-y:auto;padding:20px}
#ob-box{width:min(540px,96vw);border:1px solid var(--border);background:var(--panel);padding:28px 30px;border-radius:4px}
#ob-title{color:var(--green);font-size:14px;letter-spacing:4px}
#ob-sub{color:var(--dim2);font-size:10px;letter-spacing:2px;margin:4px 0 16px}
#ob-pips{display:flex;gap:4px;margin-bottom:16px}
.pip{height:2px;flex:1;background:var(--dim)}.pip.done{background:var(--green)}.pip.active{background:var(--blue)}
#ob-body{min-height:190px}
.obl{color:var(--dim2);font-size:10px;letter-spacing:1px;display:block;margin:12px 0 5px}
.ob-row{display:flex;gap:10px}.ob-row>div{flex:1}
.sr{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.sr>label{width:110px;font-size:10px;color:var(--dim2);flex-shrink:0}
.sr input[type=range]{flex:1}.sr>span{width:26px;text-align:right;color:var(--blue);font-size:12px}
.ob-list{list-style:none}
.ob-list li{display:flex;gap:6px;margin-bottom:6px;align-items:center}
.ob-list li .lt{flex:1}.ob-list li .ls{width:55px;flex-shrink:0}.ob-list li .le{width:36px;flex-shrink:0}.ob-list li .lx{width:52px;flex-shrink:0}
.ob-list li .rm{padding:2px 6px;color:#ef4444;border-color:#ef4444;font-size:10px;flex-shrink:0}
.ob-add{color:var(--green);border-color:var(--green);font-size:10px;padding:3px 10px;margin-top:6px;border-radius:2px}
#ob-footer{display:flex;justify-content:space-between;align-items:center;margin-top:20px;padding-top:14px;border-top:1px solid var(--border)}
#ob-info{color:var(--dim2);font-size:10px}
#ob-next{background:var(--green);color:#111;border:none;padding:10px 26px;font-size:11px;letter-spacing:3px;font-family:var(--f);cursor:pointer;border-radius:2px;font-weight:bold}
#ob-prev{padding:8px 14px;color:var(--dim2);border-color:var(--dim)}

/* ── APP — CSS GRID ── */
#app{
  display:grid;
  grid-template-rows:44px 1fr 150px;
  grid-template-columns:200px 1fr 260px;
  grid-template-areas:"hdr hdr hdr" "left center right" "chat chat chat";
  height:100vh;
}

/* HEADER */
#hdr{grid-area:hdr;display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--border)}
#hdr-name{color:var(--text);font-size:13px;letter-spacing:2px;white-space:nowrap;font-weight:bold}
#hdr-lvl{font-size:10px;padding:2px 8px;letter-spacing:2px;white-space:nowrap;border:1px solid;border-radius:2px}
.lvl-low{color:var(--green);border-color:var(--green)}
.lvl-mid{color:var(--blue);border-color:var(--blue)}
.lvl-high{color:var(--purple);border-color:var(--purple)}
.lvl-max{color:var(--orange);border-color:var(--orange)}
#xp-wrap{flex:1;min-width:0}
#xp-bg{height:4px;background:var(--border);border-radius:2px}
#xp-fill{height:100%;background:linear-gradient(90deg,var(--green),var(--blue));width:0;transition:width .7s;border-radius:2px}
#xp-txt{color:var(--dim2);font-size:9px;margin-top:2px;letter-spacing:1px}
#hdr-city{color:var(--dim2);font-size:10px;white-space:nowrap}
.hdot{color:var(--dim)}
#hdr-date{color:var(--dim2);font-size:10px;white-space:nowrap}
#hdr-time{color:var(--blue);font-size:11px;white-space:nowrap}

/* LEFT — Stats + Rep + Quest */
#left{grid-area:left;overflow-y:auto;border-right:1px solid var(--border);padding:12px}
.sec-title{font-size:9px;letter-spacing:3px;color:var(--dim2);margin:14px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--border)}
.sec-title:first-child{margin-top:0}
.statrow{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.slabel{width:70px;font-size:9px;color:var(--dim2);letter-spacing:1px;flex-shrink:0}
.sbg{flex:1;height:3px;background:var(--border);border-radius:2px}
.sfill{height:100%;border-radius:2px;transition:width .5s}
.sv{width:22px;text-align:right;font-size:9px;color:var(--text)}
.reprow{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.rlabel{width:72px;font-size:9px;color:var(--dim2);letter-spacing:1px}
.stars{font-size:11px;letter-spacing:1px}
/* Quest in left */
.mq-name{font-size:11px;color:var(--text);margin-bottom:5px;line-height:1.4}
.mqbar{display:flex;align-items:center;gap:8px}
.mqpct{font-size:10px;color:var(--blue);white-space:nowrap}

/* CENTER — Stickman + Priority */
#center{grid-area:center;display:flex;flex-direction:column;overflow:hidden;align-items:center;background:var(--bg)}
#fig-area{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;position:relative;min-height:0}
#fig-svg-wrap{position:relative;display:flex;align-items:flex-end;justify-content:center}
#fig-state-label{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font-size:8px;letter-spacing:3px;color:var(--dim)}
#pri-box{width:100%;max-width:460px;padding:10px 14px;border-top:1px solid var(--border);flex-shrink:0;background:var(--panel)}
#pri-out{min-height:40px;max-height:80px;overflow-y:auto;font-size:11px;line-height:1.6;white-space:pre-wrap;color:var(--dim2)}
#pri-foot{display:flex;justify-content:flex-end;margin-top:6px}
#btn-pri{border-color:var(--blue);color:var(--blue);font-size:10px;padding:4px 12px;border-radius:2px}
#btn-pri:hover{background:var(--blue);color:#111}

/* RIGHT — Habits + Empire */
#right{grid-area:right;overflow-y:auto;border-left:1px solid var(--border);padding:10px 10px 16px;background:var(--panel)}
#today-lbl{font-size:9px;letter-spacing:2px;color:var(--dim2);margin-bottom:10px}
.habit-card{border:1px solid var(--border);border-radius:3px;padding:8px 10px;margin-bottom:6px;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:8px}
.habit-card:hover:not(.hc-done){border-color:var(--green);background:rgba(74,222,128,.04)}
.habit-card.hc-done{opacity:.4;cursor:default}
.hc-circle{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--green);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:10px;color:#111}
.hc-done .hc-circle{background:var(--green)}
.hc-emoji{font-size:16px;flex-shrink:0}
.hc-info{flex:1;min-width:0}
.hc-name{font-size:11px;color:var(--text)}
.hc-meta{display:flex;gap:6px;margin-top:2px;font-size:9px;color:var(--dim2)}
.hc-xp{color:var(--yellow)}
.hc-streak{color:var(--orange)}
/* Empire mini in right */
.emp-item{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--border)}
.emp-item:last-child{border-bottom:none}
.emp-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.emp-name{font-size:10px;flex:1}
.emp-lvl{font-size:9px;color:var(--dim2);border:1px solid var(--dim);padding:1px 5px;border-radius:2px}

/* CHAT — bottom full width */
#chat{grid-area:chat;display:flex;flex-direction:column;border-top:1px solid var(--border);background:var(--panel2);overflow:hidden}
#msgs{flex:1;overflow-y:auto;padding:6px 14px;display:flex;flex-direction:column;gap:4px;min-height:0}
.msg{font-size:11px;line-height:1.55;padding:4px 8px;max-width:80%}
.msg.user{align-self:flex-end;color:var(--blue);background:rgba(56,189,248,.06);border-radius:3px}
.msg.ai{color:var(--text);background:rgba(255,255,255,.03);border-radius:3px;max-width:90%}
.msg.ai::before{content:'MONIR  ';color:var(--purple);font-size:9px;letter-spacing:1px}
.msg.sys{color:var(--dim);font-size:9px;align-self:center;background:none;padding:2px}
.msg .msrc{font-size:9px;color:var(--dim2);margin-top:2px}
#chat-bottom{flex-shrink:0;border-top:1px solid var(--border);display:flex;flex-direction:column}
#chat-input-row{display:flex;height:40px}
#chat-in{flex:1;background:rgba(255,255,255,.04);border:none;border-right:1px solid var(--border);color:var(--text);font-family:var(--f);font-size:12px;padding:0 12px}
#chat-in:focus{background:rgba(56,189,248,.05);outline:none}
#btn-send{height:40px;padding:0 16px;border:none;border-right:1px solid var(--border);color:var(--blue);font-size:10px;letter-spacing:1px}
#btn-send:hover{background:var(--blue);color:#111}
#btn-voice{height:40px;width:40px;border:none;font-size:15px}
#btn-voice.on{color:#ef4444;animation:pulse 1s infinite}
#chat-act-row{display:flex;height:28px;border-top:1px solid var(--border)}
.cact{flex:1;border:none;border-right:1px solid var(--border);font-size:9px;letter-spacing:1px;color:var(--dim2);background:transparent;cursor:pointer;font-family:var(--f)}
.cact:last-child{border-right:none}
.cact:hover{color:var(--green);background:rgba(74,222,128,.04)}
#cact-mode{display:inline-block;margin-right:6px;font-size:8px;padding:0 4px;border:1px solid var(--dim);border-radius:2px;vertical-align:middle}
#cact-mode.legal{color:var(--orange);border-color:var(--orange)}

@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* FX */
.xpf{position:fixed;pointer-events:none;color:var(--yellow);font-size:13px;font-weight:bold;z-index:999;animation:fup 1.4s forwards}
@keyframes fup{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-48px)}}
#lvlup-banner{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:18px;letter-spacing:6px;padding:16px 32px;z-index:998;pointer-events:none;animation:pop .3s ease;border-radius:4px}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.3)}to{transform:translate(-50%,-50%) scale(1)}}

/* Platform glow animation */
@keyframes platformGlow{0%,100%{opacity:.5}50%{opacity:1}}
#plat-glow{animation:platformGlow 3s ease-in-out infinite}
@keyframes figureFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
#fig-group{animation:figureFloat 4s ease-in-out infinite}
</style>
</head>
<body>

<!-- BOOT -->
<div id="boot">
  <div id="boot-text"></div>
  <div id="boot-bar"><div id="boot-fill"></div></div>
</div>

<!-- ONBOARDING -->
<div id="ob-overlay" class="hidden">
  <div id="ob-box">
    <div id="ob-title">MONIR KARTLEGGING</div>
    <div id="ob-sub">LIFE OS v3 — SYSTEMINITIALISERING</div>
    <div id="ob-pips"></div>
    <div id="ob-body"></div>
    <div id="ob-footer">
      <button id="ob-prev">‹ TILBAKE</button>
      <span id="ob-info"></span>
      <button id="ob-next">NESTE ›</button>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">

  <!-- HEADER -->
  <div id="hdr">
    <div id="hdr-name">MONIR</div>
    <div id="hdr-lvl" class="lvl-low">LVL 1</div>
    <div id="xp-wrap">
      <div id="xp-bg"><div id="xp-fill"></div></div>
      <div id="xp-txt">0 / 1000 XP</div>
    </div>
    <div id="hdr-city">Oslo</div><span class="hdot"> · </span>
    <div id="hdr-date"></div><span class="hdot"> · </span>
    <div id="hdr-time">00:00</div>
  </div>

  <!-- LEFT -->
  <div id="left">
    <div class="sec-title">STATS</div>
    <div class="statrow"><span class="slabel">DISIPLIN</span><div class="sbg"><div class="sfill" id="s-dis" style="background:var(--blue);width:0%"></div></div><span class="sv" id="sv-dis">—</span></div>
    <div class="statrow"><span class="slabel">INTELLIGENS</span><div class="sbg"><div class="sfill" id="s-int" style="background:var(--purple);width:0%"></div></div><span class="sv" id="sv-int">—</span></div>
    <div class="statrow"><span class="slabel">HELSE</span><div class="sbg"><div class="sfill" id="s-hel" style="background:var(--green);width:0%"></div></div><span class="sv" id="sv-hel">—</span></div>
    <div class="statrow"><span class="slabel">BUSINESS</span><div class="sbg"><div class="sfill" id="s-biz" style="background:var(--orange);width:0%"></div></div><span class="sv" id="sv-biz">—</span></div>

    <div class="sec-title">REPUTATION</div>
    <div class="reprow"><span class="rlabel">BUILDER</span><span class="stars" id="r-bld" style="color:var(--green)">☆☆☆☆☆</span></div>
    <div class="reprow"><span class="rlabel">TEKNIKER</span><span class="stars" id="r-tec" style="color:var(--blue)">☆☆☆☆☆</span></div>
    <div class="reprow"><span class="rlabel">GRÜNDER</span><span class="stars" id="r-ent" style="color:var(--orange)">☆☆☆☆☆</span></div>
    <div class="reprow"><span class="rlabel">UTØVER</span><span class="stars" id="r-ath" style="color:var(--yellow)">☆☆☆☆☆</span></div>
    <div class="reprow"><span class="rlabel">LEDER</span><span class="stars" id="r-lea" style="color:var(--purple)">☆☆☆☆☆</span></div>

    <div class="sec-title">MAIN QUEST</div>
    <div class="mq-name" id="mq-name">—</div>
    <div class="mqbar">
      <div class="sbg" style="flex:1;height:3px;border-radius:2px"><div class="sfill" id="mq-fill" style="background:var(--yellow);width:0%"></div></div>
      <span class="mqpct" id="mq-pct">0%</span>
    </div>
  </div>

  <!-- CENTER -->
  <div id="center">
    <div id="fig-area">
      <div id="fig-svg-wrap">
        <!-- The stickman + 3D platform SVG -->
        <svg id="main-svg" viewBox="0 0 240 290" width="240" height="290">
          <!-- Platform outer glow -->
          <ellipse id="plat-glow" cx="120" cy="255" rx="80" ry="18" fill="rgba(74,222,128,.08)" stroke="#4ade80" stroke-width="1" opacity=".5"/>
          <!-- Platform shadow -->
          <ellipse cx="120" cy="265" rx="72" ry="12" fill="rgba(0,0,0,.4)"/>
          <!-- Platform cylinder body -->
          <path d="M48,255 L48,270 Q120,285 192,270 L192,255" fill="#0f0f12" stroke="#2a2a30" stroke-width="1"/>
          <!-- Platform top face -->
          <ellipse cx="120" cy="255" rx="72" ry="16" fill="#1a1a1e" stroke="#4ade80" stroke-width="1.5"/>
          <!-- Platform inner rings -->
          <ellipse cx="120" cy="255" rx="50" ry="11" fill="none" stroke="rgba(74,222,128,.2)" stroke-width="1"/>
          <ellipse cx="120" cy="255" rx="28" ry="6" fill="none" stroke="rgba(74,222,128,.15)" stroke-width="1"/>
          <!-- Platform center dot -->
          <circle cx="120" cy="255" r="3" fill="rgba(74,222,128,.4)"/>

          <!-- STICKMAN GROUP (animated) -->
          <g id="fig-group">
            <!-- Shadow on platform -->
            <ellipse cx="120" cy="252" rx="14" ry="4" fill="rgba(0,0,0,.35)"/>
            <!-- Head -->
            <circle id="f-head" cx="120" cy="112" r="20" fill="none" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round"/>
            <!-- Face dot -->
            <circle cx="120" cy="112" r="3" fill="rgba(74,222,128,.3)"/>
            <!-- Neck -->
            <line id="f-neck" x1="120" y1="132" x2="120" y2="145" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round"/>
            <!-- Body -->
            <line id="f-body" x1="120" y1="145" x2="120" y2="210" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round"/>
            <!-- Left arm -->
            <line id="f-larm" x1="120" y1="162" x2="82" y2="192" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round"/>
            <!-- Right arm -->
            <line id="f-rarm" x1="120" y1="162" x2="158" y2="192" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round"/>
            <!-- Left leg -->
            <line id="f-lleg" x1="120" y1="210" x2="96" y2="252" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round"/>
            <!-- Right leg -->
            <line id="f-rleg" x1="120" y1="210" x2="144" y2="252" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round"/>
          </g>

          <!-- Aura/glow filter (increased with level) -->
          <defs>
            <filter id="glow">
              <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
              <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
          </defs>
        </svg>
        <div id="fig-state-label">IDLE</div>
      </div>
    </div>

    <div id="pri-box">
      <div id="pri-out">// Klikk PRIORITER for AI-analyse av fokus</div>
      <div id="pri-foot"><button id="btn-pri">⚡ PRIORITER</button></div>
    </div>
  </div>

  <!-- RIGHT — Habits + Empire -->
  <div id="right">
    <div id="today-lbl"></div>

    <div class="sec-title" style="margin-top:0">DAGLIGE VANER</div>
    <div id="habit-list"></div>

    <div class="sec-title">EMPIRE</div>
    <div id="empire-list"></div>
  </div>

  <!-- CHAT — bottom -->
  <div id="chat">
    <div id="msgs"></div>
    <div id="chat-bottom">
      <div id="chat-input-row">
        <input id="chat-in" type="text" placeholder="Skriv til MONIR...">
        <button id="btn-send">SEND</button>
        <button id="btn-voice">🎙</button>
      </div>
      <div id="chat-act-row">
        <button class="cact" id="cact-kart">KARTLEGG</button>
        <button class="cact" id="cact-pri">⚡ PRIORITER</button>
        <button class="cact" id="cact-mode-toggle"><span id="cact-mode">CHAT</span> MODE</button>
        <button class="cact" id="cact-jus">⚖ JUS</button>
      </div>
    </div>
  </div>

</div>

<script>
const S={char:null,habits:[],quests:[],businesses:[],assets:[],chatMode:'normal',figState:'idle',figTC:0,listening:false,ob:{step:0,data:{}}};
const STEPS=9;
const SNAMES=['IDENTITET','KROPP','STATS','MAIN QUEST','MILESTONES','EMPIRE','EIENDELER','VANER','ACHIEVEMENTS'];
const DOT_COLORS=['var(--green)','var(--blue)','var(--purple)','var(--orange)','var(--yellow)'];

// ── BOOT ──
async function boot(){
  const el=document.getElementById('boot-text'),fill=document.getElementById('boot-fill');
  for(const[i,l] of ['MONIR LIFE OS v3','───────────────','initialiserer...','laster profil...','system klar.'].entries()){
    el.textContent+=l+'\n';fill.style.width=((i+1)/5*100)+'%';await w(i===0?350:130);
  }
  await w(300);
  const b=document.getElementById('boot');b.style.transition='opacity .35s';b.style.opacity='0';await w(360);b.classList.add('hidden');
  try{S.char=await fetch('/api/character').then(r=>r.json());}catch{S.char={onboarded:false};}
  if(!S.char.onboarded)startOb();else showApp();
}

async function showApp(){
  document.getElementById('app').classList.remove('hidden');
  renderHeader();
  const[h,q,b,a]=await Promise.all([
    fetch('/api/habits').then(r=>r.json()).catch(()=>({habits:[]})),
    fetch('/api/quests').then(r=>r.json()).catch(()=>({quests:[]})),
    fetch('/api/businesses').then(r=>r.json()).catch(()=>({businesses:[]})),
    fetch('/api/assets').then(r=>r.json()).catch(()=>({assets:[]}))
  ]);
  S.habits=h.habits||[];S.quests=q.quests||[];S.businesses=b.businesses||[];S.assets=a.assets||[];
  renderLeft();renderRight();startFig();startClock();scheduleMidnight();
  sys('System klar.');
}

// ── HEADER ──
function renderHeader(){
  const c=S.char||{};
  document.getElementById('hdr-name').textContent=(c.name||'USER').toUpperCase()+' // LIFE OS';
  const lvl=c.level||1;
  const lvlEl=document.getElementById('hdr-lvl');
  lvlEl.textContent='LVL '+lvl;
  lvlEl.className=lvl<15?'lvl-low':lvl<30?'lvl-mid':lvl<50?'lvl-high':'lvl-max';
  document.getElementById('hdr-city').textContent=c.city||'Oslo';
  const pct=c.xp_next>0?Math.min(100,c.xp/c.xp_next*100):0;
  document.getElementById('xp-fill').style.width=pct+'%';
  document.getElementById('xp-txt').textContent=`${c.xp||0} / ${c.xp_next||1000} XP`;
  [['s-dis','sv-dis',c.discipline||0],['s-int','sv-int',c.intelligence||0],['s-hel','sv-hel',c.health||0],['s-biz','sv-biz',c.business_score||0]].forEach(([b,v,val])=>{document.getElementById(b).style.width=val+'%';document.getElementById(v).textContent=val;});
  [['r-bld',c.rep_builder||0],['r-tec',c.rep_tech||0],['r-ent',c.rep_entrepreneur||0],['r-ath',c.rep_athlete||0],['r-lea',c.rep_leader||0]].forEach(([id,val])=>{document.getElementById(id).textContent='★'.repeat(val)+'☆'.repeat(5-val);});
  document.getElementById('mq-name').textContent=c.main_quest||'—';
  const p=c.main_quest_progress||0;document.getElementById('mq-fill').style.width=p+'%';document.getElementById('mq-pct').textContent=p+'%';
  // Update stickman based on level
  updateFigureForLevel(lvl);
}

function updateFigureForLevel(lvl){
  const sw=Math.min(4.5,2.5+lvl*0.06);
  const col=lvl<15?'#4ade80':lvl<30?'#38bdf8':lvl<50?'#a78bfa':'#fb923c';
  const glow=Math.min(6,3+lvl*0.1);
  document.querySelectorAll('#fig-group line,#fig-group circle').forEach(el=>{
    if(el.tagName!=='circle'||el.getAttribute('r')==='20')el.setAttribute('stroke',col);
    if(el.tagName==='line')el.setAttribute('stroke-width',sw);
    if(el.tagName==='circle'&&el.getAttribute('r')==='20'){el.setAttribute('stroke',col);el.setAttribute('stroke-width',sw);}
  });
  document.getElementById('plat-glow').setAttribute('stroke',col);
  document.getElementById('main-svg').style.filter=`drop-shadow(0 0 ${glow}px ${col}44)`;
}

async function doPriority(){
  const out=document.getElementById('pri-out');out.textContent='';out.style.color='var(--text)';
  document.getElementById('btn-pri').disabled=true;document.getElementById('btn-pri').textContent='...';
  setFig('think');
  try{
    const resp=await fetch('/api/priority',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({context:''})});
    const rdr=resp.body.getReader(),dec=new TextDecoder();let buf='';
    while(true){const{done,value}=await rdr.read();if(done)break;buf+=dec.decode(value,{stream:true});const pts=buf.split('\n\n');buf=pts.pop();for(const p of pts){if(!p.startsWith('data:'))continue;try{const d=JSON.parse(p.slice(5));if(d.t==='text'){out.textContent+=d.v;out.scrollTop=out.scrollHeight;}}catch{}}}
  }catch{out.textContent='// Feil.';}
  document.getElementById('btn-pri').disabled=false;document.getElementById('btn-pri').textContent='⚡ PRIORITER';
  setFig('idle');
}

const msgsEl=document.getElementById('msgs'),chatIn=document.getElementById('chat-in');
function addMsg(role,text){const d=document.createElement('div');d.className='msg '+role;d.textContent=text;msgsEl.appendChild(d);msgsEl.scrollTop=msgsEl.scrollHeight;return d;}
function sys(t){const d=document.createElement('div');d.className='msg sys';d.textContent=t;msgsEl.appendChild(d);msgsEl.scrollTop=msgsEl.scrollHeight;}

async function sendChat(){
  const msg=chatIn.value.trim();if(!msg)return;
  chatIn.value='';addMsg('user',msg);
  const aiEl=addMsg('ai','');setFig('think');
  const isLegal=S.chatMode==='legal';
  const url=isLegal?'/api/legal':'/api/chat';
  const body=isLegal?{question:msg}:{message:msg,mode:'normal'};
  try{
    const resp=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const rdr=resp.body.getReader(),dec=new TextDecoder();let buf='';
    while(true){const{done,value}=await rdr.read();if(done)break;buf+=dec.decode(value,{stream:true});const pts=buf.split('\n\n');buf=pts.pop();for(const p of pts){if(!p.startsWith('data:'))continue;try{const d=JSON.parse(p.slice(5));if(d.t==='text'){aiEl.textContent+=d.v;msgsEl.scrollTop=msgsEl.scrollHeight;}if(d.t==='sources'&&d.v?.length){const s=document.createElement('div');s.className='msrc';s.textContent='📚 '+d.v.join(' · ');aiEl.appendChild(s);}}catch{}}}
  }catch{aiEl.textContent='Feil.';}
  setFig('idle');
}
document.getElementById('btn-send').addEventListener('click',sendChat);
chatIn.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendChat();}});

// ── STICKMAN ──
const POSES={
  idle:{la:[120,162,82,192],ra:[120,162,158,192],ll:[120,210,96,252],rl:[120,210,144,252]},
  wave:{la:[120,162,75,130],ra:[120,162,168,130],ll:[120,210,96,252],rl:[120,210,144,252]},
  think:{la:[120,162,82,192],ra:[120,162,152,148],ll:[120,210,96,252],rl:[120,210,144,252]},
  pose:{la:[120,162,68,150],ra:[120,162,172,150],ll:[120,210,88,256],rl:[120,210,152,256]},
  lean:{la:[120,162,75,200],ra:[120,162,165,196],ll:[120,210,92,252],rl:[120,210,142,252]}
};
let fC={...POSES.idle},fT={...POSES.idle},fAid=null,fB=0,fTc=0;
function setFig(s){S.figState=s;fT={...POSES[s]||POSES.idle};document.getElementById('fig-state-label').textContent=s.toUpperCase();}
function figTick(ts){
  fB=Math.sin(ts/1300)*3.5;
  ['la','ra','ll','rl'].forEach(k=>{fC[k]=fC[k].map((v,i)=>v+(fT[k][i]-v)*.055);});
  if(S.figState==='idle'){fC.la[1]+=(162+fB-fC.la[1])*.08;fC.ra[1]+=(162+fB-fC.ra[1])*.08;}
  const m={la:'f-larm',ra:'f-rarm',ll:'f-lleg',rl:'f-rleg'};
  Object.entries(m).forEach(([k,id])=>{const e=document.getElementById(id),v=fC[k];if(e){e.setAttribute('x1',v[0].toFixed(1));e.setAttribute('y1',v[1].toFixed(1));e.setAttribute('x2',v[2].toFixed(1));e.setAttribute('y2',v[3].toFixed(1));}});
  const hd=document.getElementById('f-head');if(hd)hd.setAttribute('cy',(112+Math.sin(ts/1900)*1.2).toFixed(2));
  const nk=document.getElementById('f-neck');if(nk){nk.setAttribute('y1',(132+Math.sin(ts/1900)*1.2).toFixed(2));nk.setAttribute('y2',(145+Math.sin(ts/1900)*1.2).toFixed(2));}
  fTc++;if(fTc>320&&S.figState==='idle'){fTc=0;const st=['idle','idle','idle','wave','pose','lean','think'];const nx=st[Math.floor(Math.random()*st.length)];setFig(nx);if(nx!=='idle')setTimeout(()=>setFig('idle'),3400);}
  fAid=requestAnimationFrame(figTick);
}
function startFig(){if(fAid)cancelAnimationFrame(fAid);fAid=requestAnimationFrame(figTick);}

function newOb(){return{name:'',age:null,city:'Oslo',height_cm:null,weight_kg:null,discipline:50,intelligence:50,health:50,business_score:50,rep_builder:3,rep_tech:3,rep_entrepreneur:3,rep_athlete:2,rep_leader:3,main_quest:'',main_quest_progress:0,businesses:[],assets:[],vehicles:[],milestones:[],achievements:[],habits:[]};}

function obBiz(){const l=document.getElementById('biz-list');if(!l)return;l.addEventListener('input',e=>{const t=e.target;if(t.dataset.ti!==undefined&&S.ob.data.businesses[+t.dataset.ti])S.ob.data.businesses[+t.dataset.ti].name=t.value;if(t.dataset.li!==undefined&&S.ob.data.businesses[+t.dataset.li])S.ob.data.businesses[+t.dataset.li].level=+t.value;});l.addEventListener('click',e=>{if(e.target.dataset.ri!==undefined){S.ob.data.businesses.splice(+e.target.dataset.ri,1);renderObStep();}});document.getElementById('add-biz')?.addEventListener('click',()=>{S.ob.data.businesses.push({name:'',level:1});renderObStep();});}
function obAsset(){const l=document.getElementById('asset-list');if(!l)return;l.addEventListener('input',e=>{const t=e.target;if(t.dataset.ei!==undefined&&S.ob.data.assets[+t.dataset.ei])S.ob.data.assets[+t.dataset.ei].emoji=t.value;if(t.dataset.ti!==undefined&&S.ob.data.assets[+t.dataset.ti])S.ob.data.assets[+t.dataset.ti].name=t.value;if(t.dataset.si!==undefined&&S.ob.data.assets[+t.dataset.si])S.ob.data.assets[+t.dataset.si].status=t.value;});l.addEventListener('click',e=>{if(e.target.dataset.ri!==undefined){S.ob.data.assets.splice(+e.target.dataset.ri,1);renderObStep();}});document.getElementById('add-asset')?.addEventListener('click',()=>{S.ob.data.assets.push({name:'',emoji:'📦',status:'locked'});renderObStep();});}
function obHab(){const l=document.getElementById('hab-list');if(!l)return;l.addEventListener('input',e=>{const t=e.target;if(t.dataset.ei!==undefined&&S.ob.data.habits[+t.dataset.ei])S.ob.data.habits[+t.dataset.ei].emoji=t.value;if(t.dataset.ti!==undefined&&S.ob.data.habits[+t.dataset.ti])S.ob.data.habits[+t.dataset.ti].name=t.value;if(t.dataset.xi!==undefined&&S.ob.data.habits[+t.dataset.xi])S.ob.data.habits[+t.dataset.xi].xp=+t.value;});l.addEventListener('click',e=>{if(e.target.dataset.ri!==undefined){S.ob.data.habits.splice(+e.target.dataset.ri,1);renderObStep();}});document.getElementById('add-hab')?.addEventListener('click',()=>{S.ob.data.habits.push({name:'',emoji:'⚡',xp:20});renderObStep();});}
document.getElementById('ob-next').addEventListener('click',async()=>{saveStep();if(S.ob.step===0&&!S.ob.data.name){alert('Skriv inn navn.');return;}if(S.ob.step<STEPS-1){S.ob.step++;renderObStep();}else await submitOb();});
document.getElementById('ob-prev').addEventListener('click',()=>{saveStep();if(S.ob.step>0){S.ob.step--;renderObStep();}});
async function submitOb(){
  const btn=document.getElementById('ob-next');btn.textContent='LAGRER...';btn.disabled=true;
  try{const r=await fetch('/api/onboarding/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(S.ob.data)});const res=await r.json();document.getElementById('ob-overlay').classList.add('hidden');S.char=await fetch('/api/character').then(r=>r.json());showApp();sys(`MONIR aktivert — LVL ${res.level}`);setFig('wave');setTimeout(()=>setFig('idle'),3000);}
  catch{btn.textContent='START MONIR ›';btn.disabled=false;alert('Feil ved lagring.');}
}

function w(ms){return new Promise(r=>setTimeout(r,ms));}
boot();
</script>
</body>
</html>
